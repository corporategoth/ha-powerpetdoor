# Home Assistant integrations are not installed from a wheel - HACS copies
# custom_components/powerpetdoor/ into the user's config directory and Home
# Assistant reads manifest.json for the runtime requirements. So there is no
# [build-system] here on purpose: this file configures the *development*
# environment (lint, types, tests, coverage) and nothing is ever published
# from it. manifest.json is the shipping manifest; see the version-matrix
# section of .claude/CLAUDE.md for the files that must agree.
[project]
name = "ha-powerpetdoor"
version = "0.5.0"
description = "Home Assistant integration for Power Pet Door"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Preston Elder", email = "prez@neuromancy.net"}
]
# Floored at the oldest interpreter that can run a Home Assistant this
# integration actually PASSES on. Measured, not chosen - see
# .github/ha-matrix.json and scripts/ha_matrix.py, which installs each pair
# and runs the suite.
#
# Worth stating because the two answers differ: a resolve-only probe said
# 3.12 supported HA 2024.6.0-2025.1.4. Running the tests showed the
# integration does not work there at all, so 3.12 is out and the real floor
# is HA 2025.4.0 on 3.13. Declaring the resolvable range would have been a
# claim CI could not back.
# Note the PATCH: HA 2026.2.3 requires >=3.13.2, so a bare ">=3.13" admits
# 3.13.0 and 3.13.1, on which no supported Home Assistant installs, and uv
# refuses the whole lock. Third time this exact trap has bitten in this
# repo - every version boundary upstream is patch-level.
requires-python = ">=3.13.2"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
keywords = ["power pet door", "pet door", "home assistant", "hacs", "home automation"]

# Mirrors manifest.json's "requirements". Home Assistant installs those at
# runtime; these exist so the dev venv and the test suite resolve the same
# library the integration will actually import. tests/test_ci_gates.py
# asserts the two lists agree, so they cannot drift.
dependencies = [
    "pypowerpetdoor>=0.4.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    # pytest-homeassistant-custom-component pins exactly one Home Assistant
    # release per version, so the interpreter decides which HA a dev venv
    # gets. Each branch below is the NEWEST Home Assistant that interpreter
    # can run, per the measurement in .github/ha-matrix.json - which is the
    # right default for local work. CI overrides this to also test each
    # interpreter's OLDEST supported HA; that is the whole point of the
    # matrix job, and it is why the unit-tests job does not use `--locked`.
    #
    # Every split is on python_full_version down to the PATCH, not the
    # minor. Both boundaries here are patch-level upstream: HA 2026.2.3
    # requires >=3.13.2 and HA 2026.8.3 requires >=3.14.2, so a marker of
    # `>= '3.13'` or `>= '3.14'` silently includes interpreters (3.13.0,
    # 3.13.1, 3.14.0, 3.14.1) on which that HA cannot install - and uv
    # rejects the whole lock rather than resolving it.
    "pytest-homeassistant-custom-component==0.13.316 ; python_full_version < '3.14.2'",
    "pytest-homeassistant-custom-component==0.13.357 ; python_full_version >= '3.14.2'",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    # Suite-wide backstop: a regression that deadlocks must fail the build,
    # not occupy the runner until the job timeout.
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "syrupy>=4.7.0",
    # The simulator, for the integration tests that drive a real protocol
    # conversation instead of a mock.
    "pypowerpetdoor[simulator]>=0.4.2",
    # Static analysis
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    # Runs the hooks in .pre-commit-config.yaml; installed by
    # scripts/setup-dev.sh, which is what a fresh clone should run.
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/corporategoth/ha-powerpetdoor"
Repository = "https://github.com/corporategoth/ha-powerpetdoor"
Issues = "https://github.com/corporategoth/ha-powerpetdoor/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-n auto"
# pytest-homeassistant-custom-component's own plugins emit warnings that are
# not ours to fix, so a blanket `error` would fail the suite on HA's
# internals. Everything raised from this integration is escalated instead.
filterwarnings = [
    "error:::custom_components.powerpetdoor",
]
# Backstop against a deadlock regression, not a performance budget - the
# whole suite runs in well under a minute and the slowest single test is
# far under a second, so this can only fire on a genuine hang.
timeout = 60
# ...and it must cover tests/fuzz/ too, which is the half where a novel
# input finds a novel hang. pytest-timeout's default "signal" method raises
# inside the running test frame; hypothesis catches whatever the body raises
# and re-invokes it to shrink, but the one-shot SIGALRM is spent, so every
# shrink attempt re-enters the hang with no alarm armed and the process
# spins forever. The thread method runs its timer off-thread, dumps every
# stack and calls os._exit(), so hypothesis cannot swallow it.
timeout_method = "thread"
markers = [
    "slow: end-to-end scenarios driven through the simulator",
]

[tool.coverage.run]
source = ["custom_components/powerpetdoor"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
precision = 2
# Every pattern here is a `re.search` against the WHOLE source line, so a
# bare phrase matches docstrings, f-strings and dict keys exactly as
# readily as the construct it names - which silently drops real statements
# out of the gate. Anchor instead: comment patterns to an actual comment,
# and structural patterns to the start of a line.
exclude_lines = [
    "#\\s*pragma:\\s*no\\s+cover\\s*($|\\()",
    "^\\s*def __repr__",
    "^\\s*raise NotImplementedError",
    "^\\s*if TYPE_CHECKING:",
    "^\\s*if __name__ == .__main__.:",
    "^\\s*@overload\\s*$",
    # Ellipsis *stub bodies* only. A bare `\.\.\.` is a `re.search` against
    # the whole source line, so it also matches log strings, comments and
    # `tuple[str, ...]` annotations.
    "(^\\s*\\.\\.\\.\\s*$)|(:\\s*\\.\\.\\.\\s*$)",
]
# Leaving this unset does not mean "no branch exclusions": it means
# coverage's own default, `#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(branch|
# BRANCH)`, which is a bare unanchored `re.search` and therefore forgives a
# missing branch arc on any line that merely *mentions* the phrase.
partial_branches = [
    "#\\s*pragma:\\s*no\\s+branch\\s*($|\\()",
]

[tool.coverage.paths]
source = [
    "custom_components/powerpetdoor",
    "*/custom_components/powerpetdoor",
]

[tool.coverage.html]
directory = "coverage_html"
title = "ha-powerpetdoor Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"
pretty_print = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# Home Assistant's own ruleset, trimmed to what applies to a custom
# integration. D (pydocstyle) is included because HA core review checks
# docstrings on every module, class and public method.
select = ["E", "F", "I", "N", "W", "UP", "B", "D", "SIM", "RUF", "ASYNC", "TRY", "PL"]
ignore = [
    # Line too long - protocol constants and translation strings read
    # better unwrapped.
    "E501",
    # Conflicts with D213; HA uses the D212 convention (summary on the
    # first line).
    "D213",
    # D203/D211 are mutually exclusive; HA uses D211 (no blank line before
    # a class docstring).
    "D203",
    # HA raises plain-message exceptions with translation keys attached, so
    # the "assign to a variable first" rule fights the house style.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Test files use long literal protocol payloads, mock class names, and do
# not need module/class docstrings on every fixture.
# Fixtures read better with noun-phrase docstrings ("A config entry for a
# door at TEST_HOST") than with the imperative D401 wants, and a test file
# needs no module/class/function docstring boilerplate. PLR0917 fires on
# parametrized tests, which legitimately take several fixtures.
"tests/**/*.py" = [
    "E501", "N806",
    "D100", "D101", "D102", "D103", "D104", "D205", "D401",
    "PLR2004", "PLR0913", "PLR0917",
]
# The scripts are standalone CLI tools. Each carries a long module docstring
# explaining what it measures and why, and their helpers are documented by
# the `#:` comments above them. Requiring a docstring on every small helper
# on top of that produces restatement, not documentation.
# D400/D401/D205 are HA-core docstring *style* (imperative mood, trailing
# period). They stay enforced for custom_components/, which is what HA
# review reads; the scripts use noun-phrase summaries ("(header version,
# banner version) - either may be None") that say more than an imperative
# restatement would.
"scripts/**/*.py" = [
    "PLR2004", "D101", "D102", "D103", "D205", "D400", "D401",
    "PLR0911", "PLR0912", "PLR0915", "C901",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
# Deliberately NOT pinned to `requires-python`'s floor. mypy parses the
# installed Home Assistant as well as our own code, and HA's source uses
# syntax from the interpreter it requires - with python_version = "3.12"
# mypy aborts on HA's own `config_entries.py` ("Type parameter defaults are
# only supported in Python 3.13 and greater") before reaching a single line
# of ours. Leaving it unset checks against the running interpreter, which is
# the interpreter that HA is installed for. Genuine 3.12 incompatibility is
# caught by the py3.12 row of the CI matrix actually running the suite,
# which is a stronger check than a static assumption anyway.
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# Platinum's strict-typing rule. The integration is small enough that this
# is achievable, and pypowerpetdoor ships py.typed so the library side is
# checked rather than Any.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# The rest of Home Assistant's STRICT_SETTINGS, which is what a component
# listed in `.strict-typing` is checked with. Verified to be a no-op today -
# the code already satisfies them - so this costs nothing and stops the set
# quietly diverging from what the platinum rule actually means.
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# The test suite leans on pytest-homeassistant-custom-component fixtures,
# which are not annotated end to end.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
