name: Sync Wiki to GitHub

on:
  wiki:

jobs:
  sync:
    # The ONLY `uses:` in this repository that receives a secret, so its SHA
    # pin matters more than the rest. Renovate resolves it against this Gitea
    # (the shared preset maps neuromancy/workflows to gitea-tags).
    uses: neuromancy/workflows/.gitea/workflows/sync-github-wiki.yml@5d9eb7fbdc4212eea790375b2ec82f421a30037a # v1.1.0
    secrets:
      github_token: ${{ secrets.GH_PAT }}
    with:
      github_repo: "corporategoth/ha-powerpetdoor"
